<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="低空原理实验室 · 先猜错一次，再看懂它为什么错">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3d91"/>
      <stop offset="0.55" stop-color="#082c6b"/>
      <stop offset="1" stop-color="#0e1b2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b35"/>
      <stop offset="1" stop-color="#ffb08a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 仪表网格 -->
  <g stroke="#2b3f5a" stroke-width="1" opacity="0.55">
    <line x1="0" y1="118" x2="1200" y2="118"/>
    <line x1="0" y1="512" x2="1200" y2="512"/>
    <line x1="790" y1="0" x2="790" y2="630"/>
  </g>
  <g stroke="#2b3f5a" stroke-width="1" opacity="0.3">
    <line x1="0" y1="630" x2="1200" y2="0" transform="translate(0,0)"/>
  </g>

  <!-- 右上角刻度弧 -->
  <g transform="translate(1000,250)" fill="none" stroke="#8fd0ff" stroke-opacity="0.35" stroke-width="2">
    <circle r="150"/>
    <circle r="112" stroke-opacity="0.22"/>
    <g stroke="#8fd0ff" stroke-opacity="0.7">
      <line x1="0" y1="-150" x2="0" y2="-134" transform="rotate(-60)"/>
      <line x1="0" y1="-150" x2="0" y2="-134" transform="rotate(-30)"/>
      <line x1="0" y1="-150" x2="0" y2="-134"/>
      <line x1="0" y1="-150" x2="0" y2="-134" transform="rotate(30)"/>
      <line x1="0" y1="-150" x2="0" y2="-134" transform="rotate(60)"/>
    </g>
  </g>
  <!-- 风三角：航向 / 风偏 / 航迹 -->
  <g transform="translate(1000,250)" fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M0 78 L0 -6" stroke="#8fd0ff"/>
    <path d="M0 -6 L72 -66" stroke="#ff6b35"/>
    <path d="M0 78 L72 -66" stroke="#7fe0b0" stroke-dasharray="7 7"/>
    <circle cx="0" cy="-6" r="7" fill="#ff6b35" stroke="none"/>
  </g>

  <!-- 左侧文本 -->
  <g font-family="'PingFang SC','HarmonyOS Sans SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif">
    <g transform="translate(72,120)">
      <rect x="0" y="0" width="290" height="40" rx="20" fill="#ffffff" fill-opacity="0.12"/>
      <text x="145" y="27" fill="#8fd0ff" font-size="19" text-anchor="middle" letter-spacing="1">CAAC 理论考试 · 交互式原理学习</text>
    </g>

    <text x="72" y="268" fill="#ffffff" font-size="76" font-weight="700" letter-spacing="2">低空原理实验室</text>

    <rect x="72" y="300" width="86" height="6" rx="3" fill="url(#accent)"/>

    <text x="72" y="368" fill="#eaf1fa" font-size="34" font-weight="500">先猜错一次，再看懂它为什么错</text>
    <text x="72" y="416" fill="#a8bcd6" font-size="23">每条原理都标上这在你手上是哪根杆</text>

    <g transform="translate(72,470)" font-size="19" fill="#a8bcd6">
      <g>
        <rect x="0" y="0" width="176" height="46" rx="10" fill="#16253c"/>
        <text x="88" y="30" text-anchor="middle" fill="#eaf1fa">升力从哪来</text>
      </g>
      <g transform="translate(196,0)">
        <rect x="0" y="0" width="176" height="46" rx="10" fill="#16253c"/>
        <text x="88" y="30" text-anchor="middle" fill="#eaf1fa">迎角与失速</text>
      </g>
      <g transform="translate(392,0)">
        <rect x="0" y="0" width="176" height="46" rx="10" fill="#16253c"/>
        <text x="88" y="30" text-anchor="middle" fill="#eaf1fa">风三角修正</text>
      </g>
      <g transform="translate(588,0)">
        <rect x="0" y="0" width="176" height="46" rx="10" fill="#16253c"/>
        <text x="88" y="30" text-anchor="middle" fill="#eaf1fa">高度的真实</text>
      </g>
    </g>
  </g>
</svg>
